name: 'Set up ext-wasm build environment'
description: 'Installs PHP and the Rust toolchain ext-php-rs needs'

inputs:
  php:
    required: true
  ts:
    required: false
    default: 'nts'
  extensions:
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      env:
        phpts: ${{ inputs.ts }}
      with:
        php-version: ${{ inputs.php }}
        extensions: ${{ inputs.extensions }}
        coverage: none

    # ext-php-rs needs the unstable vectorcall ABI on Windows.
    - name: Install Rust (nightly on Windows)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ runner.os == 'Windows' && 'nightly' || 'stable' }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        # ImageOS (ubuntu22, ubuntu24, ...) keeps builds on different runner
        # images apart; restoring one image's target dir on another fails.
        key: php${{ inputs.php }}-${{ inputs.ts }}-${{ env.ImageOS }}

    # Runner images can carry several LLVM versions. bindgen takes the header
    # paths from the default clang, so its libclang has to be the same
    # version: a newer one does not know the builtins of older intrinsics
    # headers and fails on emmintrin.h (seen on ubuntu-22.04 x86_64).
    - name: Use the libclang of the default clang for bindgen
      if: runner.os == 'Linux'
      shell: bash
      run: |
        version=$(clang -dumpversion | cut -d. -f1)
        dir=/usr/lib/llvm-$version/lib
        ls "$dir"/libclang*.so* > /dev/null 2>&1 || { echo "::error::no libclang in $dir"; exit 1; }
        echo "clang $(clang -dumpversion), LIBCLANG_PATH=$dir"
        echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"

    - name: Use Xcode's libclang for bindgen
      if: runner.os == 'macOS'
      shell: bash
      run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
