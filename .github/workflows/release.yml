name: release

# Builds the prebuilt binaries PIE downloads, named as PIE expects:
# php_wasm-{version}_php{major.minor}-{arch}-{os}-{libc}[-zts].zip, holding wasm.so,
# and on Windows php_wasm-{version}-{major.minor}-{ts|nts}-{compiler}-{arch}.zip,
# holding a DLL of the same name.
# Tag releases with a plain version (0.2.0), since the tag becomes {version}.
# The release starts as a draft, and PIE only sees it once it is published.
#
# Run it by hand with a tag to build that tag again with this workflow, for
# example after a build failed, without moving the tag: it builds the tag's
# code and replaces the assets of the existing release.

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, such as 0.1.0'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --draft --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: create-release
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: [nts, zts]
        target:
          # Built on Ubuntu 22.04 so the binaries only need glibc 2.35, which
          # covers Debian bookworm, the base of the official PHP images.
          - { runner: ubuntu-22.04, os: linux, arch: x86_64, libc: glibc, library: libwasm.so }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64, libc: glibc, library: libwasm.so }
          - { runner: macos-latest, os: darwin, arch: arm64, libc: bsdlibc, library: libwasm.dylib }
          - { runner: windows-latest, os: windows, arch: x86_64, library: wasm.dll }
        exclude:
          - { ts: zts, target: { os: darwin } }
          # CI only tests thread-safe PHP on Linux, so no untested Windows ZTS build ships.
          - { ts: zts, target: { os: windows } }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The setup action of this workflow's commit, not of the tag, so a rebuild
      # gets fixes to the build environment.
      - uses: actions/checkout@v5
        with:
          path: .ci
          sparse-checkout: .github/actions

      - uses: ./.ci/.github/actions/setup
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}

      - name: Check thread safety of the installed PHP
        run: |
          actual=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          [ "$actual" = "${{ matrix.ts }}" ] || { echo "::error::expected ${{ matrix.ts }} PHP, got $actual"; exit 1; }

      - run: cargo build --release --locked

      - name: Test the binary that gets published
        run: php -d "extension=$PWD/target/release/${{ matrix.target.library }}" tools/phpunit.phar

      - name: Package and upload
        if: matrix.target.os != 'windows'
        run: |
          suffix=""
          [ "${{ matrix.ts }}" = "zts" ] && suffix="-zts"
          asset="php_wasm-${TAG}_php${{ matrix.php }}-${{ matrix.target.arch }}-${{ matrix.target.os }}-${{ matrix.target.libc }}${suffix}.zip"
          mkdir -p package
          cp "target/release/${{ matrix.target.library }}" package/wasm.so
          (cd package && zip "../$asset" wasm.so)
          gh release upload "$TAG" "$asset" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # PIE matches the compiler PHP was built with, which php -i reports as
      # "PHP Extension Build => API20230831,NTS,VS16".
      - name: Package and upload for Windows
        if: matrix.target.os == 'windows'
        run: |
          compiler=$(php -i | tr -d '\r' | sed -n 's/^PHP Extension Build => //p' | tr ',' '\n' | grep -E '^V[CS][0-9]+$' | tr '[:upper:]' '[:lower:]')
          [ -n "$compiler" ] || { echo "::error::no compiler in php -i"; exit 1; }
          name="php_wasm-${TAG}-${{ matrix.php }}-${{ matrix.ts }}-${compiler}-${{ matrix.target.arch }}"
          mkdir -p package
          cp "target/release/${{ matrix.target.library }}" "package/$name.dll"
          (cd package && 7z a "../$name.zip" "$name.dll")
          gh release upload "$TAG" "$name.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
