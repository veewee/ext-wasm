name: release

# Builds the prebuilt binaries PIE downloads, named as PIE expects:
# php_wasm-{version}_php{major.minor}-{arch}-{os}-{libc}[-zts].zip, holding wasm.so.

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: create-release
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: [nts, zts]
        target:
          - { runner: ubuntu-latest, os: linux, arch: x86_64, libc: glibc, library: libwasm.so }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, libc: glibc, library: libwasm.so }
          - { runner: macos-latest, os: darwin, arch: arm64, libc: bsdlibc, library: libwasm.dylib }
        exclude:
          - { ts: zts, target: { os: darwin } }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}

      - name: Check thread safety of the installed PHP
        run: |
          actual=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          [ "$actual" = "${{ matrix.ts }}" ] || { echo "::error::expected ${{ matrix.ts }} PHP, got $actual"; exit 1; }

      - run: cargo build --release --locked

      - name: Test the binary that gets published
        run: php -d "extension=$PWD/target/release/${{ matrix.target.library }}" tools/phpunit.phar

      - name: Package and upload
        run: |
          suffix=""
          [ "${{ matrix.ts }}" = "zts" ] && suffix="-zts"
          asset="php_wasm-${GITHUB_REF_NAME}_php${{ matrix.php }}-${{ matrix.target.arch }}-${{ matrix.target.os }}-${{ matrix.target.libc }}${suffix}.zip"
          mkdir -p package
          cp "target/release/${{ matrix.target.library }}" package/wasm.so
          (cd package && zip "../$asset" wasm.so)
          gh release upload "$GITHUB_REF_NAME" "$asset"
        env:
          GH_TOKEN: ${{ github.token }}
