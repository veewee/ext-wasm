name: php-extension-tests

on:
  pull_request: ~
  push: ~

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest, macos-latest, windows-latest]
        ts: [nts]
        include:
          - { php: '8.4', os: ubuntu-latest, ts: zts }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          php -d "extension=$PWD/$EXTENSION" tools/phpunit.phar

      - name: Run examples
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          # Temporary diagnostics for an intermittent crash at exit on Windows:
          # every example runs several times, with and without module unloading.
          failures=0
          for unload in yes no; do
            for run in 1 2 3 4 5; do
              for example in examples/*.php; do
                if [ "$unload" = no ]; then export ZEND_DONT_UNLOAD_MODULES=1; else unset ZEND_DONT_UNLOAD_MODULES; fi
                set +e
                php -d "extension=$PWD/$EXTENSION" "$example" > /dev/null 2> stderr.txt
                code=$?
                set -e
                if [ "$code" != 0 ]; then
                  failures=$((failures + 1))
                  echo "::warning::$example exited with $code (unload=$unload, run $run): $(cat stderr.txt)"
                fi
              done
            done
          done
          [ "$failures" = 0 ]

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  source-install:
    name: Source install through phpize (as PIE does)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: phpize && ./configure && make
      - name: Load the built module
        run: |
          php -d "extension=$PWD/modules/wasm.so" -r 'exit(extension_loaded("wasm") ? 0 : 1);'
