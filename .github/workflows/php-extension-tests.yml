name: php-extension-tests

on:
  pull_request: ~
  push: ~

# A newer push to the same branch makes the running checks of the previous one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest, macos-latest, windows-latest]
        ts: [nts]
        include:
          - { php: '8.4', os: ubuntu-latest, ts: zts }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          php -d "extension=$PWD/$EXTENSION" tools/phpunit.phar

      - name: Run examples
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          failures=0
          for example in examples/*.php; do
            set +e
            php -d "extension=$PWD/$EXTENSION" "$example" > /dev/null 2> stderr.txt
            code=$?
            set -e
            if [ "$code" != 0 ]; then
              failures=$((failures + 1))
              echo "::error::$example exited with $code: $(cat stderr.txt)"
            fi
          done
          [ "$failures" = 0 ]

  doom:
    name: DOOM example, headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: cargo build --release --locked
      - run: examples/doom/download.sh
      - name: Run 100 game ticks
        run: php -d "extension=$PWD/target/release/libwasm.so" examples/doom/doom.php --ticks=100 --screenshot=title.ppm
      - name: Check a frame was drawn
        run: test "$(head -c 2 title.ppm)" = P6

  python:
    name: Python example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: cargo build --release --locked
      - run: examples/python/download.sh
      - name: Run Python code
        run: test "$(php -d "extension=$PWD/target/release/libwasm.so" examples/python/run.php 'print(6*7)' < /dev/null)" = 42

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  source-install:
    name: Source install through phpize (as PIE does)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: phpize && ./configure && make
      - name: Load the built module
        run: |
          php -d "extension=$PWD/modules/wasm.so" -r 'exit(extension_loaded("wasm") ? 0 : 1);'
