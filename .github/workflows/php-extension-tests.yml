name: php-extension-tests

on:
  pull_request: ~
  push: ~

# A newer push to the same branch makes the running checks of the previous one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        os: [ubuntu-latest, macos-latest, windows-latest]
        ts: [nts]
        include:
          - { php: '8.4', os: ubuntu-latest, ts: zts }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}

      - name: Build
        run: cargo build --release --locked

      - name: Run tests
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          php -d "extension=$PWD/$EXTENSION" tools/phpunit.phar

      - name: Run examples
        run: |
          case "$RUNNER_OS" in
            Linux) EXTENSION=target/release/libwasm.so ;;
            macOS) EXTENSION=target/release/libwasm.dylib ;;
            Windows) EXTENSION=target/release/wasm.dll ;;
          esac
          failures=0
          for example in examples/*.php; do
            set +e
            php -d "extension=$PWD/$EXTENSION" "$example" > /dev/null 2> stderr.txt
            code=$?
            set -e
            if [ "$code" != 0 ]; then
              failures=$((failures + 1))
              echo "::error::$example exited with $code: $(cat stderr.txt)"
            fi
          done
          [ "$failures" = 0 ]

  doom:
    name: DOOM example, headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: cargo build --release --locked
      - run: examples/doom/download.sh
      - name: Run 100 game ticks
        run: php -d "extension=$PWD/target/release/libwasm.so" examples/doom/doom.php --ticks=100 --screenshot=title.ppm
      - name: Check a frame was drawn
        run: test "$(head -c 2 title.ppm)" = P6

  python:
    name: Larger examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: cargo build --release --locked
      - run: examples/python/download.sh
      - name: Run Python code
        run: test "$(php -d "extension=$PWD/target/release/libwasm.so" examples/python/run.php 'print(6*7)' < /dev/null)" = 42
      - run: examples/quickjs/download.sh
      - name: Run the shared JavaScript rules
        run: |
          php -d "extension=$PWD/target/release/libwasm.so" examples/quickjs/checkout.php | grep -q '"gross": 3688'
      - run: examples/oxipng/download.sh
      - name: Optimise a PNG
        run: |
          php -d "extension=$PWD/target/release/libwasm.so" examples/oxipng/optimise.php | grep -q '262488 bytes -> 758 bytes'
      - name: Build and run the Rust example
        run: |
          examples/rust-markdown/build.sh
          echo '**rust**' | php -d "extension=$PWD/target/release/libwasm.so" examples/rust-markdown/render.php | grep -q '<strong>rust</strong>'
      - name: Build and run the HTML example
        run: |
          examples/html/build.sh
          php -d "extension=$PWD/target/release/libwasm.so" examples/html/middleware.php | grep -q 'loading="lazy"'
      - name: Build and run the Typst example
        run: |
          examples/typst/build.sh
          php -d "extension=$PWD/target/release/libwasm.so" examples/typst/invoice.php invoice.pdf
          test "$(head -c 5 invoice.pdf)" = %PDF-
      - name: Build and run the service probe example
        run: |
          examples/service-probe/build.sh
          php -S 127.0.0.1:18080 -t examples/service-probe > /dev/null 2>&1 &
          php -r '$s = stream_socket_server("tcp://127.0.0.1:16379"); while ($c = stream_socket_accept($s, -1)) { fgets($c); fwrite($c, "+PONG\r\n"); fclose($c); }' &
          sleep 1
          php -d "extension=$PWD/target/release/libwasm.so" examples/service-probe/probe.php 127.0.0.1:18080 127.0.0.1:16379 > probe.txt
          cat probe.txt
          grep -q '127.0.0.1:18080 *HTTP' probe.txt
          grep -q '127.0.0.1:16379 *Redis' probe.txt
      - name: Run concurrent lookups through Amp
        run: |
          composer install -d examples/async --no-interaction --no-progress
          php -d "extension=$PWD/target/release/libwasm.so" examples/async/lookup.php | grep -qx concurrent

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  source-install:
    name: Source install through phpize (as PIE does)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          php: '8.4'
      - run: phpize && ./configure && make
      - name: Load the built module
        run: |
          php -d "extension=$PWD/modules/wasm.so" -r 'exit(extension_loaded("wasm") ? 0 : 1);'
