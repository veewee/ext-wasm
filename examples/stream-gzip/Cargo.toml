[package]
name = "stream-gzip"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
wit-bindgen = { version = "=0.62.0", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
