[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
authors = ["Toon Verwerft <toonverwerft@gmail.com>"]
description = "A WebAssembly extension for PHP"
readme = "README.md"
license = "MIT"
keywords = ["php", "extension", "webassembly"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.16.0"
rayon = "=1.12.0"
wasmparser = { version = "=0.258.0", default-features = false, features = ["std"] }
wat = "=1.259.0"
wasmtime = { version = "=49.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat", "gc", "gc-drc", "parallel-compilation", "cache", "backtrace", "addr2line", "demangle", "component-model", "component-model-async"] }
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p1"] }
wasmtime-wasi-http = { version = "=49.0.1", default-features = false, features = ["default-send-request", "p2"] }
# Already dependencies of wasmtime-wasi-http; used directly for the host allowlist, see src/component/http.rs.
bytes = "=1.12.1"
http = "=1.5.0"
http-body-util = "=0.1.5"
# Already a dependency of wasmtime (via its object crate); checksums precompiled artifacts, see src/precompiled.rs.
crc32fast = "=1.5.2"
# Already a dependency of wasmtime-wasi; used directly for a runtime per process, see engine.rs.
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "time", "net", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[profile.release]
strip = "symbols"
